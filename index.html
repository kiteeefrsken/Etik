
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 90%;
      max-width: 380px;
      padding: 36px 26px;
      text-align: center;
      background: #18181c;
      border: 1px solid #303036;
      border-radius: 18px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    p {
      color: #a5a5b0;
      font-size: 14px;
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: white;
      color: #171717;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e6e6e6;
    }

    .note {
      font-size: 11px;
      margin-top: 20px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome</h1>
    <p>Sign in to continue to my website.</p>

    <button id="signin">
      Continue with Google
    </button>

    <p class="note">
      Secure sign-in powered by Google
    </p>
  </main>

  <script>
    document.getElementById("signin").addEventListener("click", () => {
      alert("Google Sign-In will be connected in the next step!");
    });
  </script>
</body>
</html>
